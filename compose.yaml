services:
  api:
    build: .
    environment:
      INVOICEFLOW_API_KEY: ${INVOICEFLOW_API_KEY:?Set a strong key in .env}
      INVOICEFLOW_APPROVER_API_KEY: ${INVOICEFLOW_APPROVER_API_KEY:-}
      INVOICEFLOW_DB_PATH: /app/data/invoiceflow.sqlite3
      INVOICEFLOW_ENABLE_OCR_UPLOAD: 'false'
    volumes:
      - invoiceflow_data:/app/data
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped
volumes:
  invoiceflow_data:
