[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceflow-ai"
version = "0.7.0"
description = "OCR-grounded Vietnamese invoice and medical document automation demo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "InvoiceFlow AI contributors"}]
keywords = ["ocr", "document-ai", "kie", "fastapi", "human-in-the-loop", "rpa"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.6,<3",
  "python-multipart>=0.0.12",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.0,<4.0"]
gemini = ["google-genai>=1.0,<2"]
ui = ["streamlit>=1.40,<2", "pandas>=2.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]
all = ["paddleocr>=3.0,<4.0", "google-genai>=1.0,<2", "streamlit>=1.40,<2", "pandas>=2.2,<4", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
invoiceflow = "invoiceflow_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
extend-exclude = ["*.ipynb"]
