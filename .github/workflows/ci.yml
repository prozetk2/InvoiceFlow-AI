name: Tests
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core + tests (no model downloads)
        run: python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q src tests scripts frontend
      - name: Offline unit & integration tests
        run: python -m pytest
      - name: Synthetic end-to-end demo
        run: python scripts/demo_workflow.py
      - name: Evaluation harness on the synthetic set
        run: |
          invoiceflow eval-predict eval/synthetic/ocr --output eval/synthetic/pred
          invoiceflow eval eval/synthetic/gt eval/synthetic/pred --split test >> "$GITHUB_STEP_SUMMARY"
